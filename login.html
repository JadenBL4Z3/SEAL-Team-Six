<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PulseGrid</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex; align-items:center; justify-content:center; min-height:100vh;}
  .login-card{width:380px; background:linear-gradient(180deg,#17222e 0%,var(--panel) 65%);
    border:1px solid #263b50; border-radius:14px; padding:28px 30px 24px;
    box-shadow:0 30px 60px rgba(0,0,0,.65), 8px 8px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
    transform:perspective(900px) rotateX(2deg);}
  .login-card .logo{box-shadow:0 8px 18px rgba(56,214,224,.35), inset 0 2px 0 rgba(255,255,255,.45);
    transform:perspective(300px) rotateX(8deg) rotate(-4deg);}
  .login-card h1{text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 18px rgba(56,214,224,.25)}
  .login-card .sub{text-align:center; color:var(--dim); font-size:12px; margin:6px 0 18px;}

  .steps{display:flex; gap:8px; margin-bottom:18px}
  .step{flex:1; display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:12px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--dim)}
  .step .num{width:20px; height:20px; border-radius:50%; background:#1a2634; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-family:Consolas,monospace}
  .step.active{color:var(--txt); border-color:var(--cyan)}
  .step.active .num{background:var(--cyan); color:#04252a; font-weight:700}
  .step.done .num{background:var(--green); color:#04252a}
  .step.done{color:var(--green); border-color:rgba(46,204,113,.4)}

  .panel{display:none} .panel.active{display:block}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px}
  .field input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:10px 12px; font-size:14px; outline:none; transition:.15s}
  .field input:focus{border-color:var(--cyan)}
  .btn-main{width:100%; padding:12px; background:linear-gradient(135deg,#38d6e0,#1a6f7a);
    border:none; color:#04252a; font-weight:700; font-size:14px; letter-spacing:.5px; cursor:pointer; border-radius:8px;
    box-shadow:0 4px 0 #0a3a42, 0 10px 18px rgba(0,0,0,.45); transition:transform .12s, box-shadow .12s}
  .btn-main:hover{filter:brightness(1.1)}
  .btn-main:active{transform:translateY(3px); box-shadow:0 1px 0 #0a3a42}
  .btn-face{width:100%; padding:11px; background:#182430; border:1px solid var(--line); color:var(--cyan);
    font-weight:600; font-size:13px; cursor:pointer; border-radius:8px; margin-bottom:8px;
    box-shadow:0 3px 0 #0c141d, 0 8px 14px rgba(0,0,0,.4); transition:transform .12s, box-shadow .12s}
  .btn-face:hover{border-color:var(--cyan)}
  .btn-face:active{transform:translateY(2px); box-shadow:0 1px 0 #0c141d}
  #msg, #faceMsg{text-align:center; font-size:13px; margin-top:12px; min-height:18px}
  #msg.err, #faceMsg.err{color:var(--red)}
  #faceMsg.good, .chip{color:var(--green)}
  .chip{display:block; text-align:center; font-size:12px; background:rgba(46,204,113,.12);
    border:1px solid rgba(46,204,113,.4); border-radius:20px; padding:6px; margin-bottom:14px}
  .linklike{display:block; text-align:center; margin-top:12px; background:none; border:none; color:var(--dim);
    font-size:11px; cursor:pointer; text-decoration:underline}
  .linklike:hover{color:var(--cyan)}
  .hint{margin-top:16px; text-align:center; font-size:11px; color:var(--dim); border-top:1px solid var(--line); padding-top:13px}
  .hint b{color:var(--cyan); font-family:Consolas,monospace}

  /* face scan */
  .cam-wrap{position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:10px; overflow:hidden; border:1px solid var(--line)}
  .cam-wrap video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
  .cam-off{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; text-align:center; padding:20px}
  .overlay{position:absolute; inset:0; pointer-events:none; opacity:0}
  .overlay.on{opacity:1}
  .corner{position:absolute; width:26px; height:26px; border:3px solid var(--cyan)}
  .c1{top:14px; left:14px; border-right:none; border-bottom:none}
  .c2{top:14px; right:14px; border-left:none; border-bottom:none}
  .c3{bottom:14px; left:14px; border-right:none; border-top:none}
  .c4{bottom:14px; right:14px; border-left:none; border-top:none}
  .scanline{position:absolute; left:8%; right:8%; height:3px; background:linear-gradient(90deg,transparent,#38d6e0,transparent);
    box-shadow:0 0 14px 4px rgba(56,214,224,.45); display:none}
  .scanning .scanline{display:block; animation:scan 1s linear infinite}
  @keyframes scan{0%{top:10%}50%{top:88%}100%{top:10%}}
  .scan-badge{position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(4,37,42,.8);
    color:var(--cyan); font-size:10px; letter-spacing:2px; padding:4px 10px; border-radius:20px; display:none; font-family:Consolas,monospace}
  .scanning .scan-badge{display:block}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">⚡</div>
    <h1>PulseGrid</h1>
    <div class="sub">Factory Ripple Monitor — operator sign in</div>

    <div class="steps">
      <div class="step active" id="step1"><span class="num">1</span> Face scan</div>
      <div class="step" id="step2"><span class="num">2</span> Credentials</div>
    </div>

    <!-- STEP 1: face -->
    <div class="panel active" id="panelFace">
      <div class="cam-wrap" id="camWrap">
        <video id="cam" autoplay playsinline muted></video>
        <div class="cam-off" id="camOff">Starting camera…</div>
        <div class="overlay" id="overlay">
          <div class="corner c1"></div><div class="corner c2"></div>
          <div class="corner c3"></div><div class="corner c4"></div>
          <div class="scanline"></div>
          <div class="scan-badge" id="scanBadge">FACE SCAN</div>
        </div>
      </div>
      <div id="faceMsg"></div>
      <button class="btn-face" id="btnScan" style="display:none">▶ Rescan my face</button>
      <button class="btn-face" id="btnTryAnyway" style="display:none">⏩ Try anyway with this capture</button>
      <button class="btn-face" id="btnEnroll" style="display:none">📋 First-time setup: enroll this face</button>
      <button class="linklike" id="skipFace">Camera not working? Skip face → password only</button>
    </div>

    <!-- STEP 2: credentials -->
    <div class="panel" id="panelCreds">
      <div class="chip" id="faceOkChip" style="display:none">✓ Face verified</div>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" placeholder="admin" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button id="loginBtn" class="btn-main" type="submit">Sign in</button>
        <div id="msg"></div>
      </form>
      <button class="linklike" id="backToFace">← Back to face scan</button>
      <div class="hint">Demo credentials → user <b>admin</b> · pass <b>admin123</b></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg'), faceMsg = $('faceMsg');
const cam = $('cam');
let stream = null, faceVerified = false;
let lastSigs = [], enrollMode = 'login';

/* ---------- step switching ---------- */
function showStep(n){
  $('panelFace').classList.toggle('active', n === 1);
  $('panelCreds').classList.toggle('active', n === 2);
  $('step1').classList.toggle('active', n === 1);
  $('step1').classList.toggle('done', n === 2 && faceVerified);
  $('step2').classList.toggle('active', n === 2);
  $('step2').classList.toggle('done', false);
  $('faceOkChip').style.display = (n === 2 && faceVerified) ? 'block' : 'none';
}
function stopCam(){
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('overlay').classList.remove('on','scanning');
}
async function startCam(){
  faceMsg.className = ''; faceMsg.textContent = '';
  $('btnScan').style.display = 'none'; $('btnEnroll').style.display = 'none';
  $('camOff').textContent = 'Starting camera…'; $('camOff').style.display = 'flex';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    cam.srcObject = stream;
    await new Promise(res => { if (cam.readyState >= 2) res(); else cam.onloadeddata = res; });
    $('camOff').style.display = 'none';
    $('overlay').classList.add('on');
    setTimeout(doFaceLogin, 700);                 // auto-scan once the camera is live
  } catch (e) {
    $('camOff').textContent = 'Camera blocked or unavailable. Allow camera access for localhost, or skip below.';
    $('skipFace').textContent = 'Continue with password only →';
  }
}

/* ---------- face signature (256-bit average hash, computed locally) ---------- */
function captureOne(){
  if (!cam.videoWidth) return null;
  const side = Math.min(cam.videoWidth, cam.videoHeight);
  const big = document.createElement('canvas');
  big.width = big.height = 256;
  const bctx = big.getContext('2d');
  bctx.translate(256, 0); bctx.scale(-1, 1);        // mirror to match the preview
  bctx.drawImage(cam, (cam.videoWidth - side)/2, (cam.videoHeight - side)/2, side, side, 0, 0, 256, 256);
  // face presence + light check (relaxed — works across skin tones and lighting)
  const small = document.createElement('canvas');
  small.width = 64; small.height = 48;
  const sctx = small.getContext('2d');
  sctx.drawImage(big, 0, 0, 64, 48);
  const px = sctx.getImageData(0, 0, 64, 48).data;
  let skin = 0, sum = 0;
  for (let i = 0; i < px.length; i += 4){
    const r = px[i], g = px[i+1], b = px[i+2];
    sum += (r + g + b) / 3;
    if (r > 60 && r > g + 8 && r > b + 8) skin++;      // relaxed warm-tone rule
  }
  const brightness = sum / (64*48), skinRatio = skin / (64*48);
  if (brightness < 30)  return { error: 'Too dark — add more light', noFace: true };
  if (brightness > 245) return { error: 'Too bright — avoid strong backlight', noFace: true };
  // average hash
  const tiny = document.createElement('canvas');
  tiny.width = tiny.height = 16;
  const tctx = tiny.getContext('2d');
  tctx.drawImage(big, 0, 0, 16, 16);
  const d = tctx.getImageData(0, 0, 16, 16).data;
  const grays = [];
  for (let i = 0; i < d.length; i += 4) grays.push(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
  const mean = grays.reduce((a,b)=>a+b,0) / grays.length;
  let bits = '';
  for (const g of grays) bits += g > mean ? '1' : '0';
  let hex = '';
  for (let i = 0; i < 256; i += 4) hex += parseInt(bits.substr(i,4),2).toString(16);
  return { signature: hex, faceSeen: skinRatio >= 0.02 };
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function captureN(n){
  const sigs = [], noFaceFrames = [];
  for (let i = 0; i < n; i++){
    const c = captureOne();
    if (c && c.error) noFaceFrames.push(c.error);
    if (c && c.signature) sigs.push({ signature: c.signature, faceSeen: !!c.faceSeen });
    await wait(300);
  }
  return { sigs, noFaceFrames };
}

/* ---------- step 1: scan ---------- */
async function doFaceLogin(){
  faceMsg.className = ''; faceMsg.textContent = 'Verifying face…';
  $('btnScan').style.display = 'none'; $('btnEnroll').style.display = 'none'; $('btnTryAnyway').style.display = 'none';
  enrollMode = 'login';
  $('overlay').classList.add('scanning'); $('scanBadge').textContent = 'VERIFYING';
  await wait(1300);
  const cap = await captureN(3);
  $('overlay').classList.remove('scanning');
  lastSigs = cap.sigs.map(s => s.signature);
  const anyFace = cap.sigs.some(s => s.faceSeen);
  if (!lastSigs.length){
    faceMsg.className = 'err';
    faceMsg.textContent = cap.noFaceFrames[0] || 'Camera not ready — click Rescan.';
    $('btnScan').style.display = 'block';
    return;
  }
  if (!anyFace){
    // the light check failed, but the biometric match may still work — let the user decide
    faceMsg.className = 'err';
    faceMsg.textContent = 'No face detected — center your face in the frame and rescan.';
    $('btnScan').style.display = 'block';
    $('btnTryAnyway').style.display = 'block';
    return;
  }
  await sendScan(lastSigs);
}

async function sendScan(sigs){
  const res = await fetch('/api/face/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: 'admin', signatures: sigs }),
  });
  const data = await res.json();
  $('btnTryAnyway').style.display = 'none';
  if (data.ok){
    faceVerified = true;
    faceMsg.className = 'good';
    faceMsg.textContent = '✓ Face matched (' + data.confidence + '% confidence)';
    stopCam();
    $('step1').classList.add('done');
    $('step1').querySelector('.num').textContent = '✓';
    $('step2').querySelector('.num').textContent = '2';
    setTimeout(() => { showStep(2); $('password').focus(); }, 700);
  } else if (data.code === 'NO_FACE'){
    faceMsg.className = '';
    faceMsg.textContent = 'First-time setup — no face on file yet. Look at the camera and enroll.';
    $('btnEnroll').style.display = 'block';
  } else {
    faceMsg.className = 'err';
    faceMsg.textContent = (data.error || 'Face not recognized') +
      (data.confidence !== undefined ? ' (confidence ' + data.confidence + '%)' : '');
    $('btnScan').style.display = 'block';
  }
}

/* ---------- first-time enroll (captures 4 samples) ---------- */
async function doEnroll(){
  faceMsg.className = ''; faceMsg.textContent = 'Enrolling face — hold still…';
  $('btnEnroll').style.display = 'none'; $('btnScan').style.display = 'none'; $('btnTryAnyway').style.display = 'none';
  $('overlay').classList.add('scanning'); $('scanBadge').textContent = 'ENROLLING';
  await wait(1300);
  const cap = await captureN(4);
  $('overlay').classList.remove('scanning');
  lastSigs = cap.sigs.map(s => s.signature);
  const anyFace = cap.sigs.some(s => s.faceSeen);
  if (!lastSigs.length){
    faceMsg.className = 'err'; faceMsg.textContent = cap.noFaceFrames[0] || 'Camera not ready — try again.';
    $('btnEnroll').style.display = 'block';
    return;
  }
  if (!anyFace){
    faceMsg.className = 'err';
    faceMsg.textContent = 'No face detected — move closer, or enroll anyway.';
    $('btnEnroll').style.display = 'block';
    $('btnTryAnyway').style.display = 'block';
    enrollMode = 'enroll';
    return;
  }
  await sendEnroll(lastSigs);
}

async function sendEnroll(sigs){
  const res = await fetch('/api/face/enroll', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: 'admin', signatures: sigs }),
  });
  const data = await res.json();
  $('btnTryAnyway').style.display = 'none';
  if (data.ok){
    faceMsg.className = 'good'; faceMsg.textContent = '✓ Face enrolled (' + data.samples + ' samples) — verifying you now…';
    setTimeout(doFaceLogin, 900);
  } else {
    faceMsg.className = 'err'; faceMsg.textContent = data.error;
    $('btnEnroll').style.display = 'block';
  }
}
$('btnScan').onclick = doFaceLogin;
$('btnEnroll').onclick = doEnroll;
$('btnTryAnyway').onclick = () => {
  $('btnTryAnyway').style.display = 'none';
  if (enrollMode === 'enroll') sendEnroll(lastSigs);
  else sendScan(lastSigs);
};

/* ---------- fallbacks ---------- */
$('skipFace').onclick = () => { stopCam(); faceVerified = false; showStep(2); };
$('backToFace').onclick = () => { showStep(1); startCam(); };

/* ---------- step 2: credentials ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = ''; msg.textContent = 'Signing in…';
  $('loginBtn').disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value, password: $('password').value }),
    });
    const data = await res.json();
    if (data.ok){
      localStorage.setItem('pg_token', data.token);
      localStorage.setItem('pg_user', data.user.name);
      msg.className = ''; msg.textContent = '✓ Welcome, ' + data.user.name;
      location.href = 'index.html';
    } else {
      msg.className = 'err'; msg.textContent = data.error || 'Login failed';
      $('loginBtn').disabled = false;
    }
  } catch (err){
    msg.className = 'err';
    msg.textContent = 'Cannot reach backend. Start it with:  python server.py';
    $('loginBtn').disabled = false;
  }
});

/* ---------- boot: camera starts immediately ---------- */
startCam();
</script>
</body>
</html>
